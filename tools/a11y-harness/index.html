<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataGrid — harness uji screen reader</title>
    <link rel="stylesheet" href="../../packages/theme/dist/index.css" />
    <link rel="stylesheet" href="../../packages/datagrid/dist/styles.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      .harness-grid {
        height: 420px;
      }
    </style>
  </head>
  <body class="sui-theme" data-theme="light">
    <main>
      <h1>DataGrid — harness uji screen reader</h1>
      <p>
        Gunakan halaman ini untuk skenario NVDA/VoiceOver (DG-057). Grid berisi
        selector, sort, filter row, pencarian, pager, summary, dan context menu.
      </p>
      <div id="grid" class="harness-grid"></div>
    </main>
    <script src="../../packages/adapter-vanilla/dist/simpleui-vanilla.umd.js"></script>
    <script>
      const columns = [
        { dataField: 'name', caption: 'Nama' },
        { dataField: 'city', caption: 'Kota' },
        { dataField: 'total', caption: 'Total', dataType: 'number' },
        { dataField: 'active', caption: 'Aktif', dataType: 'boolean' },
      ];
      const baseRows = Array.from({ length: 42 }, (_, index) => ({
        id: index + 1,
        name: `Karyawan ${String(index + 1).padStart(2, '0')}`,
        city: ['Jakarta', 'Bandung', 'Surabaya'][index % 3],
        total: (index + 1) * 37,
        active: index % 2 === 0,
      }));

      const rtl = new URLSearchParams(location.search).get('rtl') === '1';
      if (rtl) document.documentElement.dir = 'rtl';

      let query = '';
      let filter = null;
      let sortBy = [];
      let pageIndex = 0;
      let pageSize = 10;

      function matchCondition(row, condition) {
        if (condition[0] === 'and') {
          return condition
            .slice(1)
            .every((entry) => matchCondition(row, entry));
        }
        if (condition[0] === 'or') {
          return condition.slice(1).some((entry) => matchCondition(row, entry));
        }
        const [field, operator, value] = condition;
        const cell = row[field];
        switch (operator) {
          case 'contains':
            return String(cell ?? '')
              .toLowerCase()
              .includes(String(value).toLowerCase());
          case 'notContains':
            return !String(cell ?? '')
              .toLowerCase()
              .includes(String(value).toLowerCase());
          case 'startsWith':
            return String(cell ?? '')
              .toLowerCase()
              .startsWith(String(value).toLowerCase());
          case 'endsWith':
            return String(cell ?? '')
              .toLowerCase()
              .endsWith(String(value).toLowerCase());
          case 'eq':
            return cell === value;
          case 'neq':
            return cell !== value;
          case 'gt':
            return Number(cell) > Number(value);
          case 'gte':
            return Number(cell) >= Number(value);
          case 'lt':
            return Number(cell) < Number(value);
          case 'lte':
            return Number(cell) <= Number(value);
          case 'in':
            return Array.isArray(value) && value.includes(cell);
          default:
            return true;
        }
      }

      function handlePage(state) {
        pageIndex = state.pageIndex;
        pageSize = state.pageSize;
        refresh();
      }

      function refresh() {
        const needle = query.trim().toLowerCase();
        const filtered = baseRows.filter((row) => {
          if (
            needle &&
            !`${row.name} ${row.city}`.toLowerCase().includes(needle)
          ) {
            return false;
          }
          return filter ? matchCondition(row, filter) : true;
        });
        if (sortBy.length > 0) {
          filtered.sort((left, right) => {
            for (const descriptor of sortBy) {
              const a = left[descriptor.selector];
              const b = right[descriptor.selector];
              if (a === b) continue;
              const result =
                typeof a === 'number' && typeof b === 'number'
                  ? a - b
                  : String(a ?? '').localeCompare(String(b ?? ''));
              return descriptor.desc ? -result : result;
            }
            return 0;
          });
        }
        const totalCount = filtered.length;
        const lastPage = Math.max(0, Math.ceil(totalCount / pageSize) - 1);
        pageIndex = Math.min(pageIndex, lastPage);
        const rows = filtered.slice(
          pageIndex * pageSize,
          (pageIndex + 1) * pageSize,
        );

        grid.update({
          columns,
          rows,
          keyExpr: 'id',
          selectionMode: 'multiple',
          rtl,
          editing: {
            mode: 'cell',
            commitOnBlur: true,
            onCommit: (key, changes) => {
              const row = baseRows.find((entry) => entry.id === key);
              if (row) Object.assign(row, changes);
              refresh();
            },
          },

          pageIndex,
          pageSize,
          totalCount,
          sortBy,
          onSearchChange: (next) => {
            query = next;
            pageIndex = 0;
            refresh();
          },
          onSortChange: (next) => {
            sortBy = next;
            pageIndex = 0;
            refresh();
          },
          onPageChange: handlePage,
          viewOptions: {
            filterRow: true,
            searchPanel: true,
            searchDebounceMs: 0,
            contextMenu: true,
            onFilterChange: (next) => {
              filter = next;
              pageIndex = 0;
              refresh();
            },
            getUniqueValues: (columnId) => [
              ...new Set(baseRows.map((row) => row[columnId])),
            ],
            summaryItems: [
              { column: 'total', summaryType: 'sum' },
              { column: 'name', summaryType: 'count' },
            ],
            summaryRows: filtered,
          },
        });
      }

      const grid = SimpleUI.createDataGrid(document.getElementById('grid'), {
        columns,
        rows: baseRows.slice(0, pageSize),
        keyExpr: 'id',
        selectionMode: 'multiple',
        rtl,
        editing: {
          mode: 'cell',
          commitOnBlur: true,
          onCommit: (key, changes) => {
            const row = baseRows.find((entry) => entry.id === key);
            if (row) Object.assign(row, changes);
            refresh();
          },
        },

        pageIndex,
        pageSize,
        totalCount: baseRows.length,
        onSearchChange: (next) => {
          query = next;
          pageIndex = 0;
          refresh();
        },
        onSortChange: (next) => {
          sortBy = next;
          pageIndex = 0;
          refresh();
        },
        onPageChange: handlePage,
        viewOptions: {
          filterRow: true,
          searchPanel: true,
          searchDebounceMs: 0,
          contextMenu: true,
          onFilterChange: (next) => {
            filter = next;
            pageIndex = 0;
            refresh();
          },
          getUniqueValues: (columnId) => [
            ...new Set(baseRows.map((row) => row[columnId])),
          ],
          summaryItems: [
            { column: 'total', summaryType: 'sum' },
            { column: 'name', summaryType: 'count' },
          ],
          summaryRows: baseRows,
        },
      });
    </script>
  </body>
</html>
